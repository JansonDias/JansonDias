name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JansonDias
          outputs: |
            dist/snake-light.svg?palette=#ebedf0,#d9f2d9,#b8e6b8,#8bd38b,#5cbd5c
            dist/snake-dark.svg?palette=#161b22,#214d2b,#2f7d3c,#45a049,#6ccf70

      - name: Push snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
